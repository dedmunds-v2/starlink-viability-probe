global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: starlink-probe
    static_configs:
      # 'probe' resolves when running via docker-compose; use host.docker.internal
      # or the probe host's IP if Prometheus runs elsewhere.
      - targets: ["probe:9108"]
        labels:
          site: starlink-residential
