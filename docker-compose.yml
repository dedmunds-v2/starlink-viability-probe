# Security posture: everything binds to localhost only. The probe host may
# join untrusted networks (hotel/conference) and none of these services have
# authentication worth exposing. Access dashboards from other machines via
# SSH port-forward: ssh -L3000:localhost:3000 <probe-host>
#
# Grafana password: set GRAFANA_ADMIN_PASSWORD in a gitignored .env file here;
# the default below exists only so a fresh clone can boot for local testing.

services:
  probe:
    build: ./probe
    ports:
      - "127.0.0.1:9108:9108"
    # TCP/ICMP traceroute requires raw-socket capability
    cap_add:
      - NET_RAW
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:9108/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=90d"
    ports:
      - "127.0.0.1:9090:9090"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # M5: dish telemetry — Starlink's own dish->POP latency/loss ground truth.
  # Requires the dish (192.168.100.1:9200) to be reachable from the host
  # (static/policy route on any intermediate router: 192.168.100.0/24 via
  # the Starlink router at 192.168.1.1).
  dish-exporter:
    image: ghcr.io/sparky8512/starlink-grpc-tools:latest
    # status mode carries pop_ping_latency_ms / pop_ping_drop_rate (dish->POP
    # ground truth); alert_detail adds individual alert bits. (ping_drop is
    # not a valid mode on current releases despite older README mentions.)
    command: dish_grpc_prometheus.py status alert_detail
    ports:
      - "127.0.0.1:9854:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Override via .env (gitignored): GRAFANA_ADMIN_PASSWORD=...
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}
    ports:
      - "127.0.0.1:3000:3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
